name: Tool V1 Quality & CI

on:
  push:
    branches: [main, tool-v1]
  pull_request:
    branches: [main, tool-v1]

permissions:
  contents: read

jobs:
  v1-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run core, fail-closed, security and Studio safety tests
        env:
          AUTODUB_WORKSPACE: ${{ runner.temp }}/autodub-ci-workspace
          PYTHONUTF8: "1"
        run: >-
          python -m pytest -q --tb=short -p no:cacheprovider
          tests/test_app_paths.py
          tests/test_ocr_subtitle_locator.py
          tests/test_url_utils.py
          tests/test_v1_checkpoint_orchestrator.py
          tests/test_v1_ocr_geometry_repair.py
          tests/test_v1_quality_gate.py
          tests/test_pipeline_v2_failure_semantics.py
          tests/test_path_hardening.py
          tests/test_studio_render_safety.py
          tests/test_stop_flag_hygiene.py
