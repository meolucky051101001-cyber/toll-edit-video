name: Tool V1 Quality & CI

on:
  push:
    branches: [main, tool-v1]
  pull_request:
    branches: [main, tool-v1]

permissions:
  contents: read

jobs:
  v1-python-checks:
    name: Python ${{ matrix.python-version }} (${{ matrix.lane }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            lane: "primary-runtime"
          - python-version: "3.10"
            lane: "rollback-compatibility"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements/requirements-dev.txt
            requirements.txt
      - name: Install lightweight CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/requirements-dev.txt
      - name: Run core, shutdown scope, retired entrypoints, release policy, and health unit tests
        # Note: This lightweight CPU lane verifies deterministic unit/contract boundaries
        # without production .env, GPU/NVENC, or heavyweight ML model weights.
        # Full local acceptance requires running the sequential 3.12/3.10 suites with model_venv.
        env:
          AUTODUB_WORKSPACE: ${{ runner.temp }}/autodub-ci-workspace
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
        run: >-
          python -B -m pytest -q --tb=short -p no:cacheprovider
          tests/test_ocr_subtitle_locator.py
          tests/test_ocr_geometry_audit.py
          tests/test_ass_cover_dimensions.py
          tests/test_subtitle_tracking_regression.py
          tests/test_ocr_asr_correction.py
          tests/test_translation_caption_evidence.py
          tests/test_local_runtime_stability.py
          tests/test_control_scoped_shutdown.py
          tests/test_control_boot_pause.py
          tests/test_localized_subtitle_blur.py
          tests/test_localized_blur_ffmpeg.py
          tests/test_visual_caption_timing.py
          tests/test_ocr_failed_metrics.py
          tests/test_ocr_observation_ledger.py
          tests/test_ocr_adaptive_sampling.py
          tests/test_narration_source_policy.py
          tests/test_v1_voice_ocr_optimization.py
          tests/test_telegram_progress.py
          tests/test_qc_stage_progress.py
          tests/test_runtime_lock_regressions.py
          tests/test_environment_isolation.py
          tests/test_phase7_orchestrator_golden.py
          tests/test_v1_speech_translation_repair.py::BatchTests::test_invalid_condensation_never_cached
          tests/test_cloud_review_regressions.py
          tests/test_cloud_caption_geometry.py
          tests/test_cloud_caption_reviewer.py
          tests/test_cloud_content_repair.py
          tests/test_cloud_subtitle_timing.py
          tests/test_cloud_hidden_startup.py
          tests/test_cloud_hidden_launcher.py
          tests/test_cloud_status_balance.py
          tests/test_cloud_telegram_bot.py
          tests/test_cloud_v1_parity.py
          tests/test_url_utils.py
          tests/test_v1_checkpoint_orchestrator.py
          tests/test_speech_timeline_preservation.py
          tests/test_tts_caption_geometry.py
          tests/test_tts_final_fit.py
          tests/test_v1_ocr_geometry_repair.py
          tests/test_v1_quality_gate.py
          tests/test_pipeline_v2_failure_semantics.py
          tests/test_path_hardening.py
          tests/test_studio_render_safety.py
          tests/test_stop_flag_hygiene.py
          tests/test_v1_shutdown_scope.py
          tests/test_shutdown_review_regressions.py
          tests/test_v1_retired_entrypoints.py
          tests/test_v1_c3_cleanup_contracts.py
          tests/test_recovery_service.py
          tests/test_release_regressions.py
          tests/test_release_review_regressions.py
          tests/test_gemini_model_order.py
          tests/test_v1_asr_pyav_compat.py
          tests/test_runtime_health.py
          tests/test_v1_model_upgrades_20261118.py
          tests/test_studio_audio_sub_tts.py
          tests/test_refactor_architecture_20261118.py
          tests/test_localized_blur_stability_20261118.py
          tests/test_telegram_access.py

  v1-node-checks:
    name: Node Frontend & Dashboard Wrapper Checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run pure node:test frontend suite (no heavyweight renderer install required)
        shell: pwsh
        run: |
          $jsFiles = Get-ChildItem -Path "tests/js" -Recurse -Filter "*.test.js" | ForEach-Object { $_.FullName }
          if (-not $jsFiles) { throw "No JS test files found under tests/js" }
          node --test $jsFiles
