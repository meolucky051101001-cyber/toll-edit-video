name: Tool V1 Quality & Readiness

on:
  push:
    branches: [main, tool-v1]
  pull_request:
    branches: [main, tool-v1]

permissions:
  contents: read

jobs:
  v1-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pytest pytest-asyncio
      - name: Run Tool V1 Production Readiness Tests
        run: |
          python -m pytest tests/test_verify_production_readiness.py tests/test_v1_quality_gate.py -v
