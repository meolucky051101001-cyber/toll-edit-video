name: Tool V1 Quality & CI

on:
  push:
    branches: [main, tool-v1]
  pull_request:
    branches: [main, tool-v1]

permissions:
  contents: read

jobs:
  v1-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run Tool V1 core unit tests
        run: >-
          python -m unittest
          tests.test_app_paths
          tests.test_ocr_subtitle_locator
          tests.test_url_utils
